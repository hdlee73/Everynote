plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hdlee.pdfnote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hdlee.pdfnote'
        minSdk 26
        targetSdk 35
        versionCode 72
        versionName '1.58.1'
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { testLogging { exceptionFormat = 'full' } }
    }

    // No signing material lives in the repository. Official release APKs are signed in CI
    // (see .github/workflows/android.yml and SIGNING.md). For local signed builds, create an
    // untracked keystore.properties (storeFile, storePassword, keyAlias, keyPassword).
    def keystorePropsFile = rootProject.file('keystore.properties')
    if (keystorePropsFile.exists()) {
        def keystoreProps = new Properties()
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
        signingConfigs {
            create('local') {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            if (signingConfigs.findByName('local')) signingConfig signingConfigs.local
        }
        release {
            minifyEnabled false
            // Left unsigned unless keystore.properties exists; CI signs it with apksigner.
            if (signingConfigs.findByName('local')) signingConfig signingConfigs.local
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    implementation 'com.google.mlkit:translate:17.0.3'
    implementation 'kr.dogfoot:hwplib:1.1.11'
    implementation 'org.apache.poi:poi-scratchpad:5.2.5'
    implementation 'org.tukaani:xz:1.10'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
