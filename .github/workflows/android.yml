name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# The build job never sees signing secrets. Signing + publishing happen in the separate
# `release` job, which only runs for tags / [release] pushes on main and reads the secrets
# from the protected `release` environment (see SIGNING.md).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/checkout@v4
        with:
          repository: sanguneo/rhwptopdf
          ref: adbc4bf0f5c6e041ed65b0dbc8aa6b810990a48b
          path: .hwp-engine-source
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .hwp-engine-source
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.13.1'
      - name: Prepare Korean TTC regression font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Test and build offline HWP engine
        env:
          PDFNOTE_TEST_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
        run: python3 tools/prepare_hwp_engine.py
      - name: Build debug and release APKs
        run: set -o pipefail; gradle testDebugUnitTest assembleDebug assembleRelease 2>&1 | tee build.log
      - name: Report failing tests as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import glob,re,os,xml.etree.ElementTree as ET
          n=0
          if os.path.exists('build.log') and not glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              errs=[l.strip() for l in open('build.log',errors='ignore') if re.search(r'error:|symbol:|location:|What went wrong',l)]
              for l in errs[:10]: print('::error title=build::'+l[:400].replace('%','%25'))
          for f in sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml')):
              for case in ET.parse(f).getroot().iter('testcase'):
                  for bad in list(case.findall('failure'))+list(case.findall('error')):
                      n+=1
                      if n>9: continue
                      msg=((bad.get('message') or '')+' | '+(bad.text or '')[:700]).replace('%','%25').replace('\r','').replace('\n','%0A')
                      print('::error title=%s.%s::%s'%(case.get('classname').split('.')[-1],case.get('name'),msg[:1200]))
          print('failing tests: %d'%n)
          PY
      - name: Upload selection test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selection-test-results
          path: |
            app/build/test-results/testDebugUnitTest
            app/build/test-screenshots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Everynote-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload unsigned release APK for the signing job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 1
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')))
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-unsigned
          path: unsigned
      - name: Sign release APK (key rotation lineage)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_LINEAGE_BASE64: ${{ secrets.SIGNING_LINEAGE_BASE64 }}
          EXPECTED_CERT_SHA256: ${{ vars.EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD SIGNING_LINEAGE_BASE64; do
            [ -n "${!v:-}" ] || { echo "::error::Secret $v is not set in the 'release' environment (see SIGNING.md)"; exit 1; }
          done
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          KS="$RUNNER_TEMP/release.jks"; LIN="$RUNNER_TEMP/lineage.bin"
          trap 'rm -f "$KS" "$LIN"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
          printf '%s' "$SIGNING_LINEAGE_BASE64" | base64 -d > "$LIN"
          "$BT/zipalign" -f -p 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true --min-sdk-version 28 --rotation-min-sdk-version 28 --lineage "$LIN" --out signed.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs --min-sdk-version 28 signed.apk | tee verify.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' verify.txt \
            || { echo "::error::signed APK has no valid v3 signature (rotation lineage missing)"; exit 1; }
          if [ -n "${EXPECTED_CERT_SHA256:-}" ]; then
            want="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')"
            grep -qi "certificate SHA-256 digest: $want" verify.txt \
              || { echo "::error::signing certificate does not match EXPECTED_CERT_SHA256"; exit 1; }
          fi
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="v$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)"
          fi
          cp signed.apk "Everynote-$VERSION.apk"
          sha256sum "Everynote-$VERSION.apk" > "Everynote-$VERSION.apk.sha256"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "Everynote-$VERSION.apk" "Everynote-$VERSION.apk.sha256" --clobber
          else
            gh release create "$VERSION" "Everynote-$VERSION.apk" "Everynote-$VERSION.apk.sha256" --title "Everynote $VERSION" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA"
          fi
